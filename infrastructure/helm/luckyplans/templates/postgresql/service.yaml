{{- if .Values.keycloak.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: {{ include "luckyplans.namespace" . }}
  labels:
    {{- include "luckyplans.labels" . | nindent 4 }}
  annotations:
    # ArgoCD: PostgreSQL must be up before the prisma-migrate Sync hook (wave 0)
    argocd.argoproj.io/sync-wave: "-1"
spec:
  selector:
    app: postgresql
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
  type: ClusterIP
{{- end }}
